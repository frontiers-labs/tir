[package]
name = "tir-symbolic"
version = "0.1.0"
edition = "2024"

[lib]
bench = false
test = false
doctest = false

[dependencies]
tir-adt.workspace = true
tir-egglog.workspace = true
tir-ir-schema.workspace = true
smallvec = "1.15.2"
chumsky.workspace = true

[build-dependencies]
tir-cdsl = { workspace = true, features = ["rust-output"] }
syn = { workspace = true, features = ["full"] }

[[bin]]
bench = false
name = "tir-smt"
path = "src/bin/main.rs"

[lints]
workspace = true
