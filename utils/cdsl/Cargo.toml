[package]
name = "tir-cdsl"
version = "0.1.0"
edition = "2024"

[dependencies]
chumsky.workspace = true
logos.workspace = true
prettyplease.workspace = true
proc-macro2.workspace = true
quote.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
syn.workspace = true
tir-cst.workspace = true
tir-egglog.workspace = true

[lints]
workspace = true

[lib]
test = false
doctest = false

[[bin]]
name = "cdslc"
path = "bin/main.rs"

[dev-dependencies]
criterion.workspace = true
tir-bench.workspace = true

[[bench]]
name = "baseline"
harness = false

[[bin]]
name = "cdsl-format"
path = "bin/format.rs"
test = false
