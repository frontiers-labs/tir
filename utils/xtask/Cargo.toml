[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toml.workspace = true
tir-adt.workspace = true
xshell = "0.2.7"
libtest-mimic = "0.8"
tir-lit.workspace = true
tir-symbolic.workspace = true
tir-verify = { path = "../verify" }
tmdl.workspace = true

[lints]
workspace = true

# `cargo bench --workspace` passes tir-bench arguments to every target, which
# libtest rejects.
[lib]
bench = false

[[bin]]
name = "xtask"
path = "src/main.rs"
bench = false

[[test]]
name = "torture"
harness = false
