name: Nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Post-commit only deploys docs, so these two jobs are the only writers of the
  # caches every pull request restores from: they run on master, which is the one
  # scope GitHub shares with all branches. Keep their steps in step with the
  # ci.yaml jobs holding the same `shared-key`, or the caches diverge.
  build-and-package:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: READ_WRITE
      SCCACHE_GHA_VERSION: precommit-v1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - run: .github/scripts/install-spirv-tools.sh
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - run: cargo nextest run --workspace --locked --cargo-profile ci
      - run: cargo build --locked --profile ci --bin fcc --bin xtask
      - uses: actions/upload-artifact@v7
        with:
          name: fcc-package
          path: |
            target/ci/fcc
            target/ci/xtask
          retention-days: 1

  # The axiom proofs validate the target description rather than feed selection,
  # so a compile does not run them and pre-commit cannot afford to. Nightly is
  # where an unsound rewrite rule gets caught.
  verify-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      TIR_VERIFY_AXIOMS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      - run: .github/scripts/install-spirv-tools.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          # Restore only: `build-and-package` above is the writer of this key,
          # and a second writer whose steps differ makes the cache churn.
          save-if: "false"
      - run: cargo nextest run --workspace --locked --cargo-profile ci

  lints:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings

  # The GCC torture execute suite is corpus, not a gate: pre-commit already
  # proves fcc compiles it, so what is left to check is that the programs
  # behave identically under every pipeline and against gcc and clang.
  corpus:
    needs: build-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      CARGO_MANIFEST_DIR: ${{ github.workspace }}/xtask
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fcc-package
      - uses: actions/cache@v6
        with:
          path: target/test-suites/gcc
          key: gcc-torture-9aab80ddc5b2fa0eef80008e718067ab45f42c50
      - run: target/ci/xtask fcc-fuzz --corpus --fcc "$PWD/target/ci/fcc"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: defects-corpus
          path: target/fuzz/failures
          if-no-files-found: ignore
          retention-days: 7

  differential-fuzz:
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      CARGO_MANIFEST_DIR: ${{ github.workspace }}/xtask
      SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fcc-package
      - name: Self-test the harness
        run: target/ci/xtask fcc-fuzz --self-test --fcc "$PWD/target/ci/fcc"
      # Replaying what is already filed is what lets an issue close itself: a
      # defect is fixed when it stops reproducing, not when the job that found
      # it happens to go green. Every C-program defect is replayed here, whether
      # the fuzzer or the corpus found it.
      - name: Replay tracked defects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --state open --label fuzz --limit 500 --json body \
            >tracked.json || echo '[]' >tracked.json
          target/ci/xtask fcc-fuzz --extract tracked <tracked.json
          target/ci/xtask fcc-fuzz --replay tracked --fcc "$PWD/target/ci/fcc"
      # The seed is the run id, so coverage moves every night. Each program is
      # generated from that seed plus its index and compiled under a pipeline
      # chosen by the same per-program seed, which is what makes the
      # single-seed reproduce command in an issue land on the failure.
      - name: Fuzz
        run: |
          target/ci/xtask fcc-fuzz --fcc "$PWD/target/ci/fcc" \
            --seed "$SEED" --iterations 500
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: defects-differential-fuzz
          path: target/fuzz/failures
          if-no-files-found: ignore
          retention-days: 7

  # Cargo builds the measured compiler in the bench profile. Shared CI uses
  # instruction counts; native wall-time gates require a dedicated runner.
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev valgrind time
      - name: Identify the measurement environment
        id: environment
        shell: bash
        run: |
          {
            rustc -vV
            clang --version
            gcc --version
            valgrind --version
            ldd --version
            uname -r
            lscpu | sed -n '/Model name/p'
          } > benchmark-environment.txt
          echo "digest=$(sha256sum benchmark-environment.txt | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: target/bench-sources
          key: coremark-source-1f483d5b8316753a742cbf5590caf5bd0a4e4777
      # Nightly runs use trusted default-branch baselines. A changed harness,
      # workload or toolchain starts a new baseline instead of mixing contracts.
      - uses: actions/cache/restore@v6
        with:
          path: |
            benchmark-programs-baseline.json
            benchmark-functions-baseline.json
          key: bench-v2-${{ steps.environment.outputs.digest }}-${{ hashFiles('.github/workflows/nightly.yaml', 'Cargo.toml', 'Cargo.lock', 'utils/bench/**', 'benchmarks/programs/**', 'utils/pbqp/benches/**') }}-${{ github.run_id }}
          restore-keys: bench-v2-${{ steps.environment.outputs.digest }}-${{ hashFiles('.github/workflows/nightly.yaml', 'Cargo.toml', 'Cargo.lock', 'utils/bench/**', 'benchmarks/programs/**', 'utils/pbqp/benches/**') }}-
      # Shared runners gate fixed-work instruction counts. Output validation
      # remains outside profiling; native time needs a dedicated runner.
      - shell: bash
        run: |
          baseline=()
          if [ -f benchmark-programs-baseline.json ]; then
            baseline=(--baseline "$PWD/benchmark-programs-baseline.json")
          fi
          cargo bench --locked -p fcc --bench programs -- \
            --engine cachegrind --phase compile --filter '{fcc/dhrystone,fcc/coremark}/*/O2/compile/*' \
            --compiler fcc --level O2 --min-cases 8 --output "$PWD/bench-results/programs" "${baseline[@]}"
      - shell: bash
        run: |
          baseline=()
          if [ -f benchmark-functions-baseline.json ]; then
            baseline=(--baseline "$PWD/benchmark-functions-baseline.json")
          fi
          cargo bench --locked -p tir-pbqp --bench pbqp --features tir-bench/cachegrind -- \
            --engine cachegrind --filter dense_search/16 --iterations 1 --min-cases 1 \
            --output "$PWD/bench-results/functions" "${baseline[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmarks
          path: |
            bench-results
            benchmark-environment.txt
      - shell: bash
        run: |
          cp bench-results/programs/*/results.json benchmark-programs-baseline.json
          cp bench-results/functions/*/results.json benchmark-functions-baseline.json
          jq -e '.status == "complete"' benchmark-programs-baseline.json >/dev/null
          jq -e '.status == "complete"' benchmark-functions-baseline.json >/dev/null
      - uses: actions/cache/save@v6
        with:
          path: |
            benchmark-programs-baseline.json
            benchmark-functions-baseline.json
          key: bench-v2-${{ steps.environment.outputs.digest }}-${{ hashFiles('.github/workflows/nightly.yaml', 'Cargo.toml', 'Cargo.lock', 'utils/bench/**', 'benchmarks/programs/**', 'utils/pbqp/benches/**') }}-${{ github.run_id }}

  libfuzzer:
    # Only for the xtask binary, which reads the records embedded in open
    # issues. A broken workspace build must not stop the fuzzing, so the job
    # runs regardless and simply skips replay when the binary never arrived.
    needs: build-and-package
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - tmdl-fuzz
          - riscv-assembly-fuzz
          - arm64-assembly-fuzz
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: libfuzzer
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.1
      - uses: ./.github/actions/fcc-package
        continue-on-error: true
      - name: Fuzz
        id: fuzz
        continue-on-error: true
        run: |
          cargo +nightly fuzz run --fuzz-dir utils/fuzz ${{ matrix.target }} \
            -- -max_total_time=60 -max_len=16384 2>&1 | tee fuzz.log
      - name: Record the crash
        if: steps.fuzz.outcome == 'failure'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: .github/scripts/record-libfuzzer-crash.sh ${{ matrix.target }} fuzz.log defects
      # A raw fuzzer input is not a C program, so `xtask --replay` leaves these
      # alone; only the fuzzer knows how to feed one back in.
      - name: Replay tracked crashes
        if: hashFiles('target/ci/xtask') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/replay-libfuzzer-crashes.sh ${{ matrix.target }} defects
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: defects-libfuzzer-${{ matrix.target }}
          path: defects
          if-no-files-found: ignore
          retention-days: 7
      - name: Fail now that the crash is recorded
        if: steps.fuzz.outcome == 'failure'
        run: exit 1

  # One issue per defect, carrying the case that fails and a command that
  # reproduces it, closed when that case stops failing. Jobs that went red
  # without recording a defect are a broken build rather than a miscompile, and
  # those do get one issue per job.
  report:
    if: always()
    needs:
      [
        build-and-package,
        verify-axioms,
        lints,
        corpus,
        differential-fuzz,
        benchmarks,
        libfuzzer,
      ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      # Rendering an issue is xtask's job, so the format written into one and
      # the format parsed back out of one cannot drift apart.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: fcc-package
          path: target/ci
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: defects-*
          merge-multiple: true
          path: defects
      - env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          chmod +x target/ci/xtask 2>/dev/null || true
          .github/scripts/report-nightly-failures.sh defects
