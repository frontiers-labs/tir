name: CI

on:
  merge_group:
  pull_request:
    branches: ["master"]
  # Master is the one cache scope GitHub shares with every branch, so the push
  # run is what keeps the caches below current.
  push:
    branches: ["master"]

# A superseded push to a pull request is dead work; the merge queue is not.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything expensive hangs off `formatting`: it costs seconds, so nothing
  # else gets scheduled behind a diff that has not been run through rustfmt.
  formatting:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: cargo fmt --all --check
      # Reads manifests only, so it is as cheap as rustfmt.
      - run: .github/scripts/check-dependencies.py
      - uses: astral-sh/setup-uv@v6
      # The accepted-findings lists may only shrink against master.
      - run: git fetch --no-tags --depth=1 origin master:refs/remotes/origin/master
      - run: .github/scripts/check-ast-grep.py
        env:
          LINT_BASE: origin/master

  clippy:
    needs: formatting
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.event_name == 'push' }}
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings -Zunstable-options --merge=none
      - uses: astral-sh/setup-uv@v6
      - run: git fetch --no-tags --depth=1 origin master:refs/remotes/origin/master
      - run: .github/scripts/check-duplicates.py
        env:
          LINT_BASE: origin/master

  nisyros-software:
    needs: formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - run: cargo test -p nisyros --locked
      - run: cargo build -p nisyros --locked
      - run: bash nisyros/tests/run-external-provider.sh
      - name: Exercise the C ABI through a software Vulkan ICD
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/open.c -L target/debug -lnisyros -ldl \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-open
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$icd"
          VK_DRIVER_FILES="$icd" target/debug/nisyros-open auto
          VK_DRIVER_FILES="$icd" python3 nisyros/tests/python_abi.py \
            target/debug/libnisyros.so
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/plugin.c -L target/debug -lnisyros \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-plugin
          VK_DRIVER_FILES="$icd" target/debug/nisyros-plugin unsupported
          python3 nisyros/tests/run-join.py "$icd"
      - name: Exercise strict execution and TCP progress in the Vulkan simulator
        run: |
          mkdir -p target/debug/nisyros-vulkan-sim
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            nisyros/tests/vulkan_simulator.c -ldl -pthread \
            -o target/debug/nisyros-vulkan-sim/libvulkan.so.1
          NISYROS_EXPECT_NONCOHERENT=1 \
            LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-open strict
          LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-plugin strict
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/batch.c -L target/debug -lnisyros \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-batch
          LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-batch
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/ownership.c -L target/debug -lnisyros \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-ownership
          if LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
              target/debug/nisyros-ownership; then
            :
          else
            test "$?" -eq 77
          fi
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/kernel.c -L target/debug -lnisyros \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-kernel
          LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-pack nisyros/tests/add_one.spv \
            target/debug/nisyros-sim-add-one.nsy main 24 8 64 1 1 \
            addr:0 addr:8 value:16:4
          LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-kernel target/debug/nisyros-sim-add-one.nsy
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/submission_failure.c -L target/debug -lnisyros \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-submission-failure
          NISYROS_SIM_FAIL_SUBMIT_AT=1 \
            LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-submission-failure
          NISYROS_SIM_FAIL_WAIT_AT=1 \
            LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-submission-failure wait
          NISYROS_SIM_FAIL_SUBMIT_OOM_AT=1 \
            LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-submission-failure oom
          cc -std=c11 -Wall -Wextra -Werror -I nisyros/include \
            nisyros/tests/local_communication.c -L target/debug -lnisyros \
            -Wl,-rpath,"$PWD/target/debug" -o target/debug/nisyros-local-communication
          NISYROS_SIM_DEVICES=2 \
            LD_LIBRARY_PATH="$PWD/target/debug/nisyros-vulkan-sim:${LD_LIBRARY_PATH:-}" \
            target/debug/nisyros-local-communication
          python3 nisyros/tests/run-communication.py simulator
          python3 nisyros/tests/run-communication.py simulator --replay
          python3 nisyros/tests/run-communication.py simulator --peer-loss
          python3 nisyros/tests/run-communication.py simulator --mismatch
          python3 nisyros/tests/run-communication.py simulator --collective-mismatch
          python3 nisyros/tests/run-communication.py simulator --collective-timeout

  # Build and package once; test shards and memory checks reuse these tools.
  build:
    needs: formatting
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_GHA_VERSION: precommit-v1
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: rui314/setup-mold@v1
      - uses: taiki-e/install-action@nextest
      # The SPIR-V export checks validate their output; without the validator
      # they fail rather than pass by default.
      - run: .github/scripts/install-spirv-tools.sh
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
          save-if: ${{ github.event_name == 'push' }}
      - uses: actions/cache@v6
        with:
          path: target/test-suites/gcc
          key: gcc-torture-9aab80ddc5b2fa0eef80008e718067ab45f42c50
      - run: cargo run --locked --profile ci --package xtask -- test-pack --profile ci --torture --output target/ci-tests.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: ci-tests
          path: target/ci-tests.tar.zst
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: fcc-package
          path: |
            target/ci/fcc
            target/ci/xtask
          retention-days: 1

  # A master push only refreshes caches; the merge queue already tested it.
  test-shard:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fcc-package
      - uses: taiki-e/install-action@nextest
      - run: .github/scripts/install-spirv-tools.sh
      - uses: actions/download-artifact@v8
        with:
          name: ci-tests
          path: target
      - run: target/ci/xtask test --archive target/ci-tests.tar.zst -- --partition hash:${{ matrix.shard }}/8

  # One check for the ruleset to require in place of eight shard names.
  tests:
    if: always() && github.event_name != 'push'
    needs: test-shard
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.test-shard.result }}" = success

  # Tracks peak RSS of compiling the CoreMark corpus, the memory ratchet of the
  # "one IR" plan. Free runners give 4 vCPU / 16 GB, so the compile runs under a
  # 14 GB `ulimit -v`: a regression aborts in seconds instead of dragging the
  # runner into swap. `continue-on-error` keeps the job advisory while the
  # backend still allocates hundreds of MB per e-graph cover; drop it once the
  # Stage 1 entity diet lands and the ratchet becomes enforceable.
  peak-rss:
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/fcc-package
      - name: Fetch CoreMark
        run: git clone --depth 1 https://github.com/eembc/coremark.git /tmp/coremark
      - name: Compile CoreMark under a memory cap
        run: |
          mkdir -p /tmp/mem-stats
          cd /tmp/coremark
          status=0
          # Strictly serial: the numbers are per translation unit peaks.
          for src in core_list_join.c core_main.c core_matrix.c core_state.c core_util.c; do
            log=/tmp/mem-stats/${src%.c}.log
            ( ulimit -v 14680064
              TIR_MEM_STATS=1 /usr/bin/time -v \
                "$GITHUB_WORKSPACE/target/ci/fcc" -O2 -Ilinux -Iposix -I. \
                -DFLAGS_STR='"-O2"' -DITERATIONS=0 -c "$src" -o "/tmp/mem-stats/${src%.c}.o" \
            ) > "$log" 2>&1 || status=1
            grep -E "Maximum resident set size" "$log" | sed "s|^|$src |"
          done
          exit $status
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mem-stats
          path: /tmp/mem-stats/*.log

  docs:
    needs: formatting
    # Granted so the shared workflow's deploy job resolves; it is skipped on
    # everything but a push to master.
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yaml
