name: Perf

# Measures every merge and records the results on the perf-data branch.
# Benchboard compares each run with the previous one, opens an issue when
# Cachegrind instruction counts regress, and shows fcc against gcc and clang.
# History: https://frontiers-labs.github.io/benchboard/
on:
  workflow_dispatch:
    inputs:
      data-branch:
        description: Branch to record results on
        default: perf-data
  push:
    branches: [master]

permissions:
  contents: read

# Runs go one at a time in merge order. GitHub keeps only the newest waiting
# run, so after a burst of merges one comparison can span several commits.
concurrency:
  group: perf
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Cargo builds the measured compiler in the bench profile. Shared CI uses
  # instruction counts; native wall-time gates require a dedicated runner.
  programs:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      environment: ${{ steps.environment.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - run: sudo apt-get update && sudo apt-get install -y clang valgrind time
      - name: Identify the measurement environment
        id: environment
        run: echo "key=$(bash .github/scripts/run-perf-benchmarks.sh environment)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: target/bench-sources
          key: coremark-source-1f483d5b8316753a742cbf5590caf5bd0a4e4777
      # Output validation stays outside profiling. Full program execution uses
      # the same fixed arguments as local runs and needs a longer timeout.
      - name: Count program compilation and runtime
        run: bash .github/scripts/run-perf-benchmarks.sh programs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-programs
          path: bench-results

  # The same programs compiled by fcc, gcc and clang, for time and memory.
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - run: sudo apt-get update && sudo apt-get install -y clang time
      - uses: actions/cache@v6
        with:
          path: target/bench-sources
          key: coremark-source-1f483d5b8316753a742cbf5590caf5bd0a4e4777
      - name: Time compilation and runtime against gcc and clang
        run: bash .github/scripts/run-perf-benchmarks.sh native
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-native
          path: bench-results

  functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      environment: ${{ steps.environment.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-functions
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Identify the measurement environment
        id: environment
        run: echo "key=$(bash .github/scripts/run-perf-benchmarks.sh environment)" >> "$GITHUB_OUTPUT"
      - name: Count Rust functions
        run: bash .github/scripts/run-perf-benchmarks.sh functions
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-functions
          path: bench-results

  record:
    needs: [programs, native, functions]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: results
      - uses: frontiers-labs/benchboard@549cc7330a418e41bf18098f0abe5ef972068846
        with:
          results: results/**/summary.json
          # Cachegrind's key for executed instructions.
          gate-metrics: Ir
          threshold: 2
          # Benchboard records a run under a new key without gating it. The two
          # jobs can land on different runner images, so both keys count.
          env-key: >-
            ${{ needs.programs.outputs.environment == needs.functions.outputs.environment
            && needs.programs.outputs.environment
            || format('programs: {0} | functions: {1}', needs.programs.outputs.environment, needs.functions.outputs.environment) }}
          data-branch: ${{ inputs.data-branch || 'perf-data' }}

  # A benchmark that fails to build, run or validate is a defect of its own,
  # and no comparison exists to report it.
  report-failure:
    needs: [programs, native, functions, record]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="perf: benchmark run failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again at ${GITHUB_SHA} in $RUN_URL."
          else
            gh issue create --title "$title" --body "The Perf workflow failed at ${GITHUB_SHA} in $RUN_URL. Reproduce with \`bash .github/scripts/run-perf-benchmarks.sh programs\`, \`native\` or \`functions\`."
          fi
