name: Perf

# Measures every merge and records the results on the perf-data branch.
# Benchboard compares each run with the previous one and shows fcc against
# gcc and clang. Regressions are not reported: a run fails only when a
# benchmark does.
# History: https://frontiers-labs.github.io/benchboard/
on:
  workflow_dispatch:
    inputs:
      data-branch:
        description: Branch to record results on
        default: perf-data
  push:
    branches: [master]

permissions:
  contents: read

# Runs go one at a time in merge order. GitHub keeps only the newest waiting
# run, so after a burst of merges one comparison can span several commits.
concurrency:
  group: perf
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Wall time on shared runners, one program per job so the programs run in
  # parallel. Each runner's CPU model goes with its results, so benchboard keeps
  # one history line per machine. fcc, gcc and clang are sampled in rotated
  # order on one runner, so their ratios stay comparable.
  programs:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        program: [coremark, dhrystone]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
      - run: sudo apt-get update && sudo apt-get install -y clang time
      - uses: actions/cache@v6
        with:
          path: target/bench-sources
          key: coremark-source-1f483d5b8316753a742cbf5590caf5bd0a4e4777
      - name: Time compilation and runtime against gcc and clang
        run: bash .github/scripts/run-perf-benchmarks.sh ${{ matrix.program }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-${{ matrix.program }}-${{ matrix.runner }}
          path: bench-results

  functions:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-functions
      - name: Time Rust functions
        run: bash .github/scripts/run-perf-benchmarks.sh functions
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-functions-${{ matrix.runner }}
          path: bench-results

  # A job that fails on one runner must not discard what the others measured.
  # The failure still opens an issue below.
  record:
    needs: [programs, functions]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: results
      # A failed job uploads the cases it finished; only complete bundles count.
      - run: |
          find results -name results.json | while read -r file; do
            jq -e '.status == "complete"' "$file" > /dev/null || rm -r "$(dirname "$file")"
          done
      # Benchboard marks history where the toolchains change.
      - id: environment
        run: echo "key=$(sort -u results/*/environment | paste -sd '|')" >> "$GITHUB_OUTPUT"
      - uses: frontiers-labs/benchboard@ed901678d4edc1219aacbd4c94479c6e4d5fb779
        with:
          results: results/**/summary.json
          issue-label: ''
          env-key: ${{ steps.environment.outputs.key }}
          data-branch: ${{ inputs.data-branch || 'perf-data' }}

  # A benchmark that fails to build, run or validate is a defect of its own,
  # and no comparison exists to report it.
  report-failure:
    needs: [programs, functions, record]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="perf: benchmark run failed"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Failed again at ${GITHUB_SHA} in $RUN_URL."
          else
            gh issue create --title "$title" --body "The Perf workflow failed at ${GITHUB_SHA} in $RUN_URL. Reproduce with \`bash .github/scripts/run-perf-benchmarks.sh\` and the failed job's program or \`functions\`."
          fi
