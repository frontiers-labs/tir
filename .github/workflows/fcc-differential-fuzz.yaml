name: fcc differential fuzz

on:
  workflow_dispatch:
  schedule:
    # Nightly; the seed rotates with the day so coverage moves over time.
    - cron: "17 3 * * *"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: Swatinem/rust-cache@v2
      - name: Self-test the harness
        run: cargo xtask fcc-fuzz --self-test
      - name: Fuzz
        run: cargo xtask fcc-fuzz --seed "$(date +%Y%m%d)" --iterations 500
      - name: Cross-check the corpus
        run: cargo xtask fcc-fuzz --corpus
