name: fcc GCC torture

on:
  merge_group:
  pull_request:
    branches: ["master"]
  # Push runs populate the sccache used read-only by PR runs; the release
  # build of fcc dominates this job (21 of 28 minutes).
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  torture:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'pull_request' && 'READ_ONLY' || 'READ_WRITE' }}
      SCCACHE_GHA_VERSION: precommit-v1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: actions/cache@v6
        with:
          path: target/test-suites/gcc
          key: gcc-torture-9aab80ddc5b2fa0eef80008e718067ab45f42c50
      - run: cargo xtask fcc-torture
