name: Deploy docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_RW_MODE: ${{ github.event_name == 'push' && 'READ_WRITE' || 'READ_ONLY' }}
      SCCACHE_GHA_VERSION: precommit-v1
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rui314/setup-mold@v1
      - uses: mozilla-actions/sccache-action@v0.0.10
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.event_name == 'push' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook,mdbook-mermaid
      - name: Build docs
        run: |
          cargo build -p tir-pdl
          python3 utils/pdl/scripts/check-doc-examples.py
          cargo xtask docs
          python3 utils/scripts/check_isa_docs.py
          python3 utils/scripts/check_tmdl_reference.py
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          path: book

  deploy-docs:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-docs
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
