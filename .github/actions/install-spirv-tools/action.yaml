name: Install SPIR-V tools
description: Install SPIR-V tools on Ubuntu runners
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euxo pipefail
        if [[ -f /etc/apt/blacksmith-ubuntu-mirrors.txt ]]; then
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu' \
            | sudo tee /etc/apt/blacksmith-ubuntu-mirrors.txt >/dev/null
        fi
        ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
        if [[ ! -f $ubuntu_sources ]]; then
          ubuntu_sources=/etc/apt/sources.list
        fi
        sudo sed -i \
          -e 's|http://archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
          -e 's|http://security.ubuntu.com/ubuntu|https://security.ubuntu.com/ubuntu|g' \
          "$ubuntu_sources"
        # SPIR-V tools comes from Ubuntu. A third-party index outage should not block it.
        apt_sources=(-o "Dir::Etc::sourcelist=$ubuntu_sources" -o Dir::Etc::sourceparts=-)
        sudo apt-get "${apt_sources[@]}" update
        sudo apt-get "${apt_sources[@]}" install -y --no-install-recommends spirv-tools
