[suite]
package = "fcc"

[llvm]
prepare = ["clang", "-std=gnu17", "{level}", "{flags}", "-fno-vectorize", "-fno-slp-vectorize", "-S", "-emit-llvm", "-Xclang", "-disable-O0-optnone", "{source}", "-o", "{output}"]
version = ["clang", "--version"]

[[compiler]]
name = "fcc"
build = ["cargo", "build", "--release", "-p", "fcc", "--bin", "fcc"]
compile = ["{root}/target/release/fcc", "-std=gnu17", "{level}", "{flags}", "-c", "{source}", "-o", "{output}"]
link = ["{root}/target/release/fcc", "{objects}", "{link_flags}", "-o", "{output}"]

[compiler.env]
TIR_TIME_PASSES = "1"

[compiler.metrics]
frontend_ms = 'fcc-time: frontend_ms=([0-9.]+)'
passes_ms = 'fcc-time: frontend_ms=[0-9.]+ passes_ms=([0-9.]+)'
backend_ms = 'fcc-time: frontend_ms=[0-9.]+ passes_ms=[0-9.]+ backend_ms=([0-9.]+)'

[[compiler]]
name = "tir"
input = "llvm"
build = ["cargo", "build", "--release", "-p", "tir-tools"]
compile = ["{root}/target/release/tir", "mc", "--march", "{arch}", "--filetype", "obj", "{source}", "-o", "{output}"]
link = ["clang", "-no-pie", "{objects}", "{link_flags}", "-o", "{output}"]

[compiler.env]
TIR_TIME_PASSES = "1"

[compiler.metrics]
import_ms = 'tir-time: import_ms=([0-9.]+)'
backend_ms = 'tir-time: import_ms=[0-9.]+ backend_ms=([0-9.]+)'

[[compiler]]
name = "gcc"
compile = ["gcc", "-std=gnu17", "{level}", "{flags}", "-c", "{source}", "-o", "{output}"]
link = ["gcc", "{objects}", "{link_flags}", "-o", "{output}"]

[[compiler]]
name = "clang"
compile = ["clang", "-std=gnu17", "{level}", "{flags}", "-c", "{source}", "-o", "{output}"]
link = ["clang", "{objects}", "{link_flags}", "-o", "{output}"]
