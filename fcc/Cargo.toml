[package]
autobenches = false
name = "fcc"
version = "0.1.0"
edition = "2024"

[dependencies]
gungraun = { workspace = true, optional = true }
logos = "0.16.1"
chumsky.workspace = true
ariadne = { workspace = true }
tir = { path = "../core" }
tir-riscv.workspace = true
tir-arm64.workspace = true
tir-x86_64.workspace = true
clap = { version = "4.6.0", features = ["derive"] }
tempfile = "3.27.0"

[lib]
bench = false
test = false
doctest = false

[dev-dependencies]
anyhow.workspace = true
criterion.workspace = true
serde_json.workspace = true
tir-bench.workspace = true

[features]
nightly-cachegrind = ["dep:gungraun"]

[[bin]]
bench = false
name = "fcc"
path = "bin.rs"

[[bench]]
name = "codegen"
harness = false

[lints]
workspace = true

[[bench]]
name = "coremark"
harness = false

[[bench]]
name = "dhrystone"
harness = false

[[bench]]
name = "torture"
harness = false

[[bench]]
name = "whetstone"
harness = false
