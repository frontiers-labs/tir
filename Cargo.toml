[workspace]
resolver = "2"

members = [
    "utils/filecheck",
    "utils/lit",
    "utils/not",
    "tmdl",
    "xtask",
    "core",
    "utils/macros",
    "backends/riscv",
    "utils/fuzz",
    "simulator/isasim",
    "simulator/simcore",
    "backends/arm64",
    "backends/x86_64",
    "fcc",
    "utils/isa-test-suite",
    "utils/capi",
    "utils/adt",
    "utils/graph",
    "utils/symbolic",
    "utils/verify",
    "utils/llvm",
    "utils/jit",
    "tools",
    "gpu",
    "utils/pdl",
    "utils/pbqp",
    "utils/unit-tests",
    "utils/arrange",
    "utils/relational",
]

[workspace.dependencies]
tir = { path = "core" }
tir-sim = { path = "simulator/simcore" }
tmdl = { path = "tmdl" }

# Common utils
tir-adt = { path = "utils/adt" }
tir-arrange = { path = "utils/arrange" }
tir-graph = { path = "utils/graph" }
tir-symbolic = { path = "utils/symbolic" }
tir-macros = { path = "utils/macros" }
tir-lit = { path = "utils/lit" }
tir-llvm = { path = "utils/llvm" }
tir-jit = { path = "utils/jit" }
tir-pbqp = { path = "utils/pbqp" }
tir-relational = { path = "utils/relational" }

# Per-target crates
tir-riscv = { path = "backends/riscv" }
tir-arm64 = { path = "backends/arm64" }
tir-x86_64 = { path = "backends/x86_64" }
tir-gpu = { path = "gpu" }

anyhow = "1.0.102"
ariadne = "0.6.0"
clap = "4.6.1"
criterion = "0.8.2"
jsonschema = { version = "0.33.0", default-features = false }
linkme = "0.3.36"
logos = "0.16.1"
thiserror = "2.0.18"
quote = "1.0.45"
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
syn = "2.0.117"
chumsky = "0.13.0"
schemars = "1.0.4"
serde = "1.0.228"
serde_json = "1.0.150"
regex = "1.12.4"
toml = "0.9.10"
globset = "0.4.16"
libfuzzer-sys = "0.4"
proptest = "1.11.0"
typed-arena = "2"

[profile.bench]
debug = true
lto = "thin"

# What CI builds, tests with, and ships to the downstream suites, so the
# compiler the GCC torture corpus runs against is the binary the test suite ran.
# Inheriting dev keeps the per-package tuning below, the line tables that make a
# CI backtrace readable, and `debug-assertions` -- which is what turns the IR
# verifier on (see `ir_verification_enabled`). That last point is the whole
# argument for testing at opt-level 2 rather than shipping a release build: the
# verifier catches 54 torture cases where fcc emits invalid IR and a release
# build carries on regardless. Building fcc this way also costs less than
# release (3m30s vs 12m50s wall on 8 cores), because dev's 256 codegen units
# parallelize where release's 16 do not.
[profile.ci]
inherits = "dev"
opt-level = 2
incremental = false

# Full debug info makes a clean `cargo test --no-run` produce a ~22 GB target
# dir (40+ statically linked binaries, ~97% DWARF). Line tables keep file:line
# in backtraces, which is enough outside an interactive debugger session.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Backend build scripts link all of tmdl; without this each one is a ~220 MB
# executable. opt-level 2 makes the tmdl compiler run 5x faster inside them
# (37.8s -> 7.3s for the riscv backend), which dominates every .tmdl rebuild.
[profile.dev.build-override]
debug = false
opt-level = 2

# The generated backends are by far the largest rustc inputs in the tree (riscv
# is 500k lines of generated Rust) and their source only changes when their
# .tmdl does, so incremental state buys nothing and costs both memory and a
# multi-GB slice of target/. With debug info dropped too, a clean riscv build
# goes from 7.4 GB peak RSS / 2m41s to 6.4 GB / 2m07s.
[profile.dev.package.tir-riscv]
debug = false
incremental = false

[profile.dev.package.tir-arm64]
debug = false
incremental = false

[profile.dev.package.tir-x86_64]
debug = false
incremental = false

[profile.dev.package.filecheck]
debug = false
opt-level = 3

[profile.dev.package.tir-lit]
debug = false
opt-level = 3
