[package]
autobenches = false
name = "tir"
version = "0.1.0"
edition = "2024"

# Unit tests live in utils/unit-tests (crate tir-unit-tests); FileCheck tests
# in checks/ run through the workspace lit driver.
[lib]
bench = false
test = false
doctest = false

[dependencies]
tir-macros.workspace = true
tir-egglog = { workspace = true, features = ["parser"] }
tir-pdl.workspace = true
tir-symbolic.workspace = true
tir-adt.workspace = true
linkme.workspace = true
logos.workspace = true
smallvec = "1.15.2"
ariadne.workspace = true

[features]
egglog-rules = ["tir-egglog/parser"]

[build-dependencies]
tir-pdl.workspace = true
tir-cdsl = { workspace = true, features = ["rust-output"] }
tir-egglog = { workspace = true, features = ["parser"] }

[dev-dependencies]
tir-bench.workspace = true
criterion.workspace = true

[[bench]]
name = "lexer"
harness = false

[lints]
workspace = true
