[package]
name = "tir"
version = "0.1.0"
edition = "2024"

# Unit tests live in utils/unit-tests (crate tir-unit-tests); FileCheck tests
# in checks/ run through the workspace lit driver.
[lib]
test = false
doctest = false

[dependencies]
tir-macros.workspace = true
tir-graph.workspace = true
tir-relational.workspace = true
tir-symbolic.workspace = true
tir-adt.workspace = true
tir-arrange.workspace = true
tir-pbqp.workspace = true
linkme.workspace = true
logos.workspace = true
smallvec = "1.15.2"
thiserror = "2.0.12"
ariadne.workspace = true
tir-pdl = { path = "../utils/pdl", default-features = false }

[build-dependencies]
tir-pdl = { path = "../utils/pdl", default-features = false }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "lexer"
harness = false

[lints]
workspace = true
