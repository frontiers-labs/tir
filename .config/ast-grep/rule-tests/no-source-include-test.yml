id: no-source-include
valid:
  - 'include!(concat!(env!("OUT_DIR"), "/generated.rs"));'
  - 'std::include! { concat!(env!("OUT_DIR"), "/generated.rs") }'
  - 'include!(env!("OUT_DIR"));'
  - 'quote! { include!(#file_name); }'
  - 'quote::quote! { include!("generated.rs"); }'
  - 'const TEXT: &str = include_str!("source.rs");'
  - 'const TEXT: &str = "include!(\"source.rs\")";'
  - '// include!("source.rs");'
  - 'macro_rules! generated { () => { include!(concat!(env!("OUT_DIR"), "/generated.rs")); }; }'
  - 'macro_rules! call { () => { include("source.rs"); }; }'
  - 'macro_rules! quoted { () => { quote! { include!("generated.rs"); } }; }'
  - 'vec![quote::quote! { include!("generated.rs"); }]'
  - 'quote /*c*/ ! { include!("generated.rs"); }'
  - 'quote! /*c*/ { include!("generated.rs"); }'
invalid:
  - 'include!("source.rs");'
  - 'std::include!(r#"source.rs"#);'
  - '::std::include! { r"source.rs" }'
  - 'include!(concat!(env!("CARGO_MANIFEST_DIR"), "/source.rs"));'
  - 'include!(concat!("OUT_DIR", "/source.rs"));'
  - 'macro_rules! source { () => { include!("source.rs"); }; }'
  - 'include!(concat!(env!("OUT_DIR"), "/../../source.rs"));'
  - 'r#include!("source.rs");'
  - 'std::r#include!("source.rs");'
  - 'macro_rules! source { () => { r#include!("source.rs"); }; }'
  - 'std :: /* source */ include!("source.rs");'
  - 'cfg_if::cfg_if! { if #[cfg(unix)] { include!("source.rs"); } }'
  - 'vec![include!("source.rs")]'
  - 'vec![std::r#include!("source.rs")]'
  - 'vec![include/*c*/!("source.rs")]'
  - 'vec![include!/*c*/("source.rs")]'
  - 'x::quote! { include!("source.rs"); }'
  - 'vec![x::quote! { include!("source.rs"); }]'
