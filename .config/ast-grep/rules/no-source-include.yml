id: no-source-include
language: rust
severity: error
message: Use a Rust module instead of including repository source
note: Only generated Rust under OUT_DIR may use include!.
utils:
  past-comments:
    not:
      any:
        - kind: line_comment
        - kind: block_comment
  quotation-name:
    any:
      - regex: '^((::)?(r#)?quote::)?(r#)?(quote|quote_spanned)$'
        not:
          follows:
            regex: '^::$'
            stopBy: { matches: past-comments }
      - kind: identifier
        regex: '^(r#)?(quote|quote_spanned)$'
        follows:
          regex: '^::$'
          stopBy: { matches: past-comments }
          follows:
            kind: identifier
            regex: '^(r#)?quote$'
            stopBy: { matches: past-comments }
            not:
              follows:
                regex: '^::$'
                stopBy: { matches: past-comments }
                follows:
                  regex: '\w'
                  stopBy: { matches: past-comments }
  generated-arguments:
    all:
      - regex: '^[({\[]\s*(concat!\s*\(\s*env!\s*\(\s*"OUT_DIR"\s*\)\s*,\s*"/[^"\\]*"\s*,?\s*\)|env!\s*\(\s*"OUT_DIR"\s*\))\s*,?\s*[)}\]]$'
      - not: { regex: '\.\.' }
rule:
  any:
    - kind: macro_invocation
      has: { field: macro, regex: '\binclude$' }
      not:
        has:
          kind: token_tree
          matches: generated-arguments
    - kind: token_tree
      inside: { kind: token_tree, stopBy: end }
      follows:
        regex: '^!$'
        stopBy: { matches: past-comments }
        follows:
          kind: identifier
          regex: '^(r#)?include$'
          stopBy: { matches: past-comments }
      not: { matches: generated-arguments }
      all:
        - not:
            inside:
              kind: token_tree
              stopBy: end
              follows:
                regex: '^!$'
                stopBy: { matches: past-comments }
                follows:
                  matches: quotation-name
                  stopBy: { matches: past-comments }
