id: no-source-include
language: rust
severity: error
message: Use a Rust module instead of including repository source
note: Only generated Rust under OUT_DIR may use include!.
utils:
  generated-arguments:
    all:
      - regex: '^[({\[]\s*(concat!\s*\(\s*env!\s*\(\s*"OUT_DIR"\s*\)\s*,\s*"/[^"\\]*"\s*,?\s*\)|env!\s*\(\s*"OUT_DIR"\s*\))\s*,?\s*[)}\]]$'
      - not: { regex: '\.\.' }
rule:
  any:
    - kind: macro_invocation
      has: { field: macro, regex: '\binclude$' }
      not:
        has:
          kind: token_tree
          matches: generated-arguments
    - kind: token_tree
      inside: { kind: macro_rule, stopBy: end }
      follows:
        regex: '^!$'
        follows: { kind: identifier, regex: '^(r#)?include$' }
      not: { matches: generated-arguments }
      all:
        - not:
            inside:
              kind: token_tree
              stopBy: end
              follows:
                regex: '^!$'
                follows: { kind: identifier, regex: '^(r#)?(quote|quote_spanned)$' }
